[package]
name = "reallyme-wallet-conformance"
version = "0.1.2"
description = "EUDI wallet-core conformance fixtures and golden flow tests."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["reallyme-wallet/native"]

[dev-dependencies]
crypto_sha2_256 = { package = "reallyme-crypto-sha2-256", version = "=0.3.17", default-features = false }
reallyme-openid4vci-wallet = { workspace = true }
openid4vci-profiles = { workspace = true }
openid4vci-types = { workspace = true }
reallyme-openid-oauth = { workspace = true }
reallyme-credential-status = { workspace = true }
reallyme-ssi-proto = { workspace = true, features = ["generated"] }
reallyme-wallet = { path = "../crates/wallet", version = "0.1.2", default-features = false }
reallyme-wallet-zk = { path = "../crates/wallet-zk", version = "0.1.2" }
reallyme-zk-api = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
reallyme-trust-x509 = { workspace = true }
[lints]
workspace = true
