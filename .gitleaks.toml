minVersion = "v8.30.1"

[extend]
useDefault = true

# Exact public fixture lines are allowlisted only for the generic API-key rule.
# A changed vector requires a fresh review; whole files and commits stay scanned.

[[allowlists]]
description = "Public deterministic key-storage protobuf vectors"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)(?:vectors|crates/proto/tests/fixtures|crates/proto-codec/tests/fixtures/proto)/wallet-key-storage-v1-golden\.txt$''']
regexes = [
    '''(?m)^portable_key_storage_$''',
    '''(?m)^hardware_key_binding_$''',
]

[[allowlists]]
description = "Public deterministic provider request vector"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)(?:vectors|crates/proto/tests/fixtures|crates/proto-codec/tests/fixtures/proto)/wallet-provider-v1-golden\.txt$''']
regexes = [
    '''(?m)^get_credential_provider_request=080110071809927d1e0a1c63726564656e7469616c2d70726f76696465722d676f6c64656e2d31$''',
]

[[allowlists]]
description = "Synthetic wallet key handle"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)conformance/fixtures/wallets/wua-valid\.json$''']
regexes = [
    '''(?m)^  "holder_key_handle": "wallet-key-handle-0001",$''',
]
