[package]
name = "reallyme-wallet-runtime"
version = "0.1.0"
description = "Canonical protobuf operation runtime for ReallyMe wallet-core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/LICENSE-MIT", "/LICENSE-APACHE", "/src/**/*.rs", "/Cargo.toml"]

[features]
default = ["native"]
native = [
    "crypto_sha2_256/native",
    "reallyme-wallet-consent/native",
    "reallyme-wallet-lifecycle/native",
    "reallyme-wallet-log/native",
    "reallyme-wallet-proto-codec/native",
    "reallyme-wallet-storage/native",
    "reallyme-wallet-types/native",
]
wasm = [
    "crypto_sha2_256/wasm",
    "reallyme-wallet-consent/wasm",
    "reallyme-wallet-lifecycle/wasm",
    "reallyme-wallet-log/wasm",
    "reallyme-wallet-proto-codec/wasm",
    "reallyme-wallet-storage/wasm",
    "reallyme-wallet-types/wasm",
]

[dependencies]
buffa = { workspace = true }
crypto_sha2_256 = { workspace = true }
reallyme-ssi-proto = { workspace = true, features = ["generated"] }
reallyme-wallet-consent = { path = "../consent", version = "0.1.0", default-features = false }
reallyme-wallet-lifecycle = { path = "../lifecycle", version = "0.1.0", default-features = false }
reallyme-wallet-log = { path = "../log", version = "0.1.0", default-features = false }
reallyme-wallet-proto = { path = "../proto", version = "0.1.0", default-features = false, features = ["generated"] }
reallyme-wallet-proto-codec = { path = "../proto-codec", version = "0.1.0", default-features = false }
reallyme-wallet-storage = { path = "../storage", version = "0.1.0", default-features = false }
reallyme-wallet-types = { path = "../types", version = "0.1.0", default-features = false }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
openid4vci-proto = { workspace = true, features = ["generated"] }

[lints]
workspace = true
