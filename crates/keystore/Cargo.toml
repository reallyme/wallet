[package]
name = "reallyme-wallet-keystore"
version = "0.1.2"
description = "WSCD/WSCA key-handle boundary for ReallyMe wallet core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/LICENSE-MIT", "/LICENSE-APACHE", "/src/**/*.rs", "/Cargo.toml"]

[features]
default = ["native"]
native = []
wasm = []

[dependencies]
reallyme-wallet-lifecycle = { path = "../lifecycle", version = "0.1.2", default-features = false }
reallyme-wallet-types = { path = "../types", version = "0.1.2", default-features = false }
thiserror = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
