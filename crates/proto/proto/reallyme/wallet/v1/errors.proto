  RUNTIME_ERROR_REASON_RECORD_NOT_FOUND = 24;
  RUNTIME_ERROR_REASON_LIFECYCLE_POLICY_DENIED = 25;
  // A v1 wire operation that this runtime never executes because the request
  // cannot carry the verifier capability it would need.
  RUNTIME_ERROR_REASON_OPERATION_UNSUPPORTED = 26;
  // The parent credential is missing or not active, so no copy was claimed.
  RUNTIME_ERROR_REASON_CREDENTIAL_NOT_ACTIVE = 27;
  // The copy was claimed and burned, then withheld because its credential
  // stopped being active during the claim. The copy cannot be recovered.
  RUNTIME_ERROR_REASON_CLAIMED_COPY_DISCARDED = 28;
  // The provider does not implement a capability the operation needs.
  RUNTIME_ERROR_REASON_PROVIDER_CAPABILITY_UNSUPPORTED = 29;
  // A transaction-log or QTSP record is dated beyond the accepted skew from
  // trusted time.
  RUNTIME_ERROR_REASON_RECORD_CLOCK_SKEW = 30;
}

// WalletError carries the coarse public reason and, when available, the exact
// wallet-owned Rust reason enum that produced it.
message WalletError {
  WalletErrorReason reason = 1;
  oneof detail {
    WalletTypesErrorReason wallet_types = 10;
    StorageErrorReason storage = 11;
    KeystoreErrorReason keystore = 12;
    InventoryErrorReason inventory = 13;
    ConsentErrorReason consent = 14;
    AttestationErrorReason attestation = 15;
    WalletLogErrorReason log = 16;
    LifecycleErrorReason lifecycle = 17;
    FlowErrorReason flow = 18;
    RenderErrorReason render = 19;
    ConvertErrorReason convert = 20;
    ProtoErrorReason proto = 21;
    RuntimeErrorReason runtime = 22;
  }
}

// WalletErrorEnvelope carries the local wallet error alongside the shared
// identity-stack envelope used at cross-repository boundaries.
// reallyme.security: sensitive-owner
message WalletErrorEnvelope {
  reallyme.identity.common.v1.IdentityStackError stack = 1;
  WalletError wallet = 2;
}
