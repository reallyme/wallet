[package]
name = "reallyme-wallet-lifecycle"
version = "0.1.0"
description = "Wallet Unit lifecycle state machine for ReallyMe EUDI wallet core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/LICENSE-MIT", "/LICENSE-APACHE", "/src/**/*.rs", "/Cargo.toml"]

[features]
default = ["native"]
native = ["reallyme-wallet-types/native"]
wasm = ["reallyme-wallet-types/wasm"]

[dependencies]
reallyme-wallet-types = { path = "../types", version = "0.1.0", default-features = false }
thiserror.workspace = true
zeroize = { workspace = true }

[lints]
workspace = true
