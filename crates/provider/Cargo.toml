[package]
name = "reallyme-wallet-provider"
version = "0.1.2"
description = "Versioned provider policy and correlation validation for ReallyMe Wallet adapters."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/LICENSE-MIT", "/LICENSE-APACHE", "/src/**/*.rs", "/Cargo.toml", "/README.md"]

[features]
default = ["native"]
native = [
    "reallyme-wallet-lifecycle/native",
    "reallyme-wallet-proto/generated",
    "reallyme-wallet-proto-codec/native",
    "reallyme-wallet-runtime/native",
    "reallyme-wallet-types/native",
]
wasm = [
    "reallyme-wallet-lifecycle/wasm",
    "reallyme-wallet-proto/generated",
    "reallyme-wallet-proto-codec/wasm",
    "reallyme-wallet-runtime/wasm",
    "reallyme-wallet-types/wasm",
]

[dependencies]
buffa = { workspace = true }
reallyme-wallet-lifecycle = { path = "../lifecycle", version = "0.1.2", default-features = false }
reallyme-wallet-proto = { path = "../proto", version = "0.1.2", default-features = false }
reallyme-wallet-proto-codec = { path = "../proto-codec", version = "0.1.2", default-features = false }
reallyme-wallet-runtime = { path = "../runtime", version = "0.1.2", default-features = false }
reallyme-wallet-types = { path = "../types", version = "0.1.2", default-features = false }
thiserror = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
