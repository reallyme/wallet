[package]
name = "reallyme-wallet-inventory"
version = "0.1.0"
description = "Credential lifecycle and unlinkable batch-pool inventory for ReallyMe wallet core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/LICENSE-MIT", "/LICENSE-APACHE", "/src/**/*.rs", "/Cargo.toml"]

[features]
default = ["native"]
native = ["reallyme-wallet-storage/native", "reallyme-credential-status/native"]

[dependencies]
reallyme-wallet-storage = { path = "../storage", version = "0.1.0", default-features = false }
reallyme-credential-status = { workspace = true }
reallyme-wallet-types = { path = "../types", version = "0.1.0", default-features = false }
thiserror = { workspace = true }

[lints]
workspace = true
