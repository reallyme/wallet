[package]
name = "reallyme-wallet-render"
version = "0.1.2"
description = "Feature-gated wallet distribution render boundary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/LICENSE-MIT", "/LICENSE-APACHE", "/src/**/*.rs", "/Cargo.toml"]

[features]
default = []
native = []

[dependencies]
png = "0.18"
reallyme-codec = { workspace = true }
reallyme-wallet-types = { path = "../types", version = "0.1.2", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = "0.11"
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
url = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
