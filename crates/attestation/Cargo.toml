[package]
name = "reallyme-wallet-attestation"
version = "0.1.0"
description = "Wallet unit attestation lifecycle for ReallyMe wallet core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = ["/LICENSE-MIT", "/LICENSE-APACHE", "/src/**/*.rs", "/Cargo.toml"]

[features]
default = ["native"]
native = []
wasm = []

[dependencies]
reallyme-wallet-keystore = { path = "../keystore", version = "0.1.0", default-features = false }
reallyme-wallet-types = { path = "../types", version = "0.1.0", default-features = false }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
