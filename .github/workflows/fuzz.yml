name: Fuzz

env:
  CARGO_FUZZ_VERSION: 0.13.2

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "conformance/tests/state_machine_models/**"
      - "fuzz/**"
      - "scripts/run-fuzz-smoke.sh"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fuzz.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "conformance/tests/state_machine_models/**"
      - "fuzz/**"
      - "scripts/run-fuzz-smoke.sh"
      - "!**/*.md"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: fuzz target build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout wallet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wallet
          persist-credentials: false
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-15
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Build fuzz targets
        working-directory: wallet
        run: |
          cargo +nightly-2026-09-15 metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 --no-deps
          cargo +nightly-2026-09-15 fuzz build
      - name: Stage fuzz executables
        working-directory: wallet
        run: |
          host_target="$(rustc +nightly-2026-09-15 -vV | sed -n 's/^host: //p')"
          test -n "$host_target"
          mkdir -p fuzz-binaries
          while IFS= read -r fuzz_target; do
            test -n "$fuzz_target"
            cp "fuzz/target/${host_target}/release/${fuzz_target}" "fuzz-binaries/${fuzz_target}"
          done < <(cargo +nightly-2026-09-15 fuzz list)
      - name: Run pull-request fuzz smoke corpus
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        working-directory: wallet
        env:
          WALLET_FUZZ_BINARY_DIRECTORY: fuzz-binaries
          WALLET_FUZZ_RUNS: "16"
        run: scripts/run-fuzz-smoke.sh
      - name: Upload scheduled fuzz executables
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-executables-${{ github.sha }}
          path: wallet/fuzz-binaries
          if-no-files-found: error
          retention-days: 1
      - name: Record staged fuzz executable digests
        working-directory: wallet
        run: sha256sum fuzz-binaries/*

  scheduled:
    name: scheduled fuzz (${{ matrix.target }})
    # The staged executables are the binary-equivalent campaigns for:
    # cargo fuzz run wallet_proto_decode
    # cargo fuzz run wallet_proto_json
    # cargo fuzz run wallet_identifier
    # cargo fuzz run wallet_state_machine
    # Building once and executing the immutable binaries avoids rebuilding the
    # same source independently in every scheduled matrix cell.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - wallet_proto_decode
          - wallet_proto_json
          - wallet_identifier
          - wallet_state_machine
    steps:
      - name: Checkout wallet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wallet
          persist-credentials: false
      - name: Download fuzz executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-executables-${{ github.sha }}
          path: fuzz-executables
      - name: Run time-boxed fuzz target
        working-directory: wallet
        env:
          WALLET_FUZZ_BINARY_DIRECTORY: ../fuzz-executables
          WALLET_FUZZ_MAX_TOTAL_TIME: "300"
          WALLET_FUZZ_RSS_LIMIT_MB: "4096"
          WALLET_FUZZ_TARGET: ${{ matrix.target }}
        run: |
          chmod 0755 "../fuzz-executables/${WALLET_FUZZ_TARGET}"
          scripts/run-fuzz-smoke.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: wallet/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
