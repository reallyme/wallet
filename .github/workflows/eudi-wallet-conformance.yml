name: EUDI Wallet Conformance

on:
  workflow_dispatch:
    inputs:
      target_mode:
        description: Test the latest commit candidate or the latest published release
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - published

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  release-inputs:
    if: github.repository == 'reallyme/wallet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      preflight_run_id: ${{ steps.prepare.outputs.preflight_run_id }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      release_ref: ${{ steps.prepare.outputs.release_ref }}
      target_commit: ${{ steps.prepare.outputs.target_commit }}
      target_mode: ${{ steps.prepare.outputs.target_mode }}
      target_version: ${{ steps.prepare.outputs.target_version }}
    steps:
      - name: Checkout Wallet workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: wallet
          persist-credentials: false

      - name: Checkout pinned conformance framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/identity-conformance
          ref: 97974ea1ca9b7144bc19fa9337a089118db72924
          path: identity-conformance
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Resolve immutable target and prepare caller inputs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMEWORK_COMMIT: 97974ea1ca9b7144bc19fa9337a089118db72924
          TARGET_MODE: ${{ inputs.target_mode }}
          EUDI_WRITE_GITHUB_OUTPUT: '1'
          EUDI_FRAMEWORK_PATH: ${{ github.workspace }}/identity-conformance
          EUDI_INPUT_DIRECTORY: ${{ runner.temp }}/eudi-wallet-conformance-inputs
        working-directory: wallet
        run: node scripts/prepare_eudi_release_inputs.mjs

      - name: Upload verified candidate inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wallet-eudi-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/eudi-wallet-conformance-inputs
          if-no-files-found: error
          retention-days: 1

  eudi-wallet-conformance:
    needs: release-inputs
    uses: reallyme/identity-conformance/.github/workflows/eudi-wallet-conformance.yml@97974ea1ca9b7144bc19fa9337a089118db72924
    with:
      framework_commit: 97974ea1ca9b7144bc19fa9337a089118db72924
      conformance_profile: eudi-wallet-engineering-v1
      target_mode: ${{ needs.release-inputs.outputs.target_mode }}
      target_commit: ${{ needs.release-inputs.outputs.target_commit }}
      target_version: ${{ needs.release-inputs.outputs.target_version }}
      preflight_run_id: ${{ needs.release-inputs.outputs.preflight_run_id }}
      candidate_artifact_name: wallet-eudi-candidate-${{ github.run_id }}
      release_id: ${{ needs.release-inputs.outputs.release_id }}
      release_ref: ${{ needs.release-inputs.outputs.release_ref }}
