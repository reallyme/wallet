name: Crates Package Preflight

run-name: Crates package preflight ${{ inputs.version }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        type: string
        default: 0.1.1

concurrency:
  group: crates-package-preflight-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  BUFFA_VERSION: 0.9.2
  BUF_VERSION: 1.73.0
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  verify-source-sha:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      fuzz_run_id: ${{ steps.required-ci.outputs.fuzz_run_id }}
      protobuf_ci_run_id: ${{ steps.required-ci.outputs.protobuf_ci_run_id }}
      release_sha: ${{ steps.verify-source.outputs.release_sha }}
      release_version: ${{ steps.verify-source.outputs.release_version }}
      rust_ci_run_id: ${{ steps.required-ci.outputs.rust_ci_run_id }}
    steps:
      - name: Checkout requested release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: wallet

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Match workflow head, current main, and crate versions
        id: verify-source
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_WRITE_GITHUB_OUTPUT: '1'
        working-directory: wallet
        run: node scripts/verify_release_source.mjs

      - name: Wait for successful exact-commit release evidence
        id: required-ci
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          REQUIRED_CI_POLL_SECONDS: '60'
          REQUIRED_CI_WAIT_SECONDS: '3600'
          REQUIRED_CI_WRITE_GITHUB_OUTPUT: '1'
        working-directory: wallet
        run: node scripts/verify_required_ci.mjs

  crates-package:
    name: Review crates.io packages
    needs: verify-source-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout certified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: wallet

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 9cf40c7da1def8a8d809af51789284097c572dd5
          path: wallet/.release-readiness
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wallet

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install pinned Buffa generators
        run: >-
          cargo install
          "protoc-gen-buffa@$BUFFA_VERSION"
          "protoc-gen-buffa-packaging@$BUFFA_VERSION"
          --locked
          --target-dir "$RUNNER_TEMP/buffa-install-target"

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Scan complete Git history
        working-directory: wallet
        run: scripts/run-gitleaks.sh

      # Schema provenance validation reads the locked registry archives offline.
      # Fetch the workspace graph explicitly rather than relying on runner caches.
      - name: Fetch locked workspace dependencies
        working-directory: wallet
        run: cargo fetch --locked

      - name: Run complete release-readiness gate
        working-directory: wallet
        run: node .release-readiness/scripts/run-consumer-check.mjs

      - name: Check protobuf boundaries and generated source
        working-directory: wallet
        run: |
          node scripts/check_schema_source_lock.mjs
          buf lint
          node scripts/check_wallet_schema_breaking.mjs
          buf generate
          node scripts/harden-generated-wallet-proto.mjs
          cargo fmt --package reallyme-wallet-proto
          node scripts/harden-generated-wallet-proto.mjs --check-idempotent
          node scripts/check-proto-hardening-concurrency.mjs
          node scripts/check-proto-first-boundaries.mjs
          git diff --exit-code -- crates/proto/proto crates/proto/src/generated
          test -z "$(git status --porcelain -- crates/proto/proto crates/proto/src/generated)"

      - name: Check formatting
        working-directory: wallet
        run: cargo fmt --check

      - name: Clippy
        working-directory: wallet
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test all features
        working-directory: wallet
        run: cargo test --locked --workspace --all-features

      - name: Check Identity Wasm participant lane
        working-directory: wallet
        run: node scripts/check_rust_release_policy.mjs --check-wasm

      - name: Check dependency policy
        working-directory: wallet
        run: |
          cargo deny check
          cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check

      - name: Security advisory audit
        working-directory: wallet
        run: scripts/audit_committed_lockfiles.sh

      - name: Check intended Rust package surfaces
        working-directory: wallet
        run: node scripts/check_rust_package_surfaces.mjs

      - name: Test release scripts
        working-directory: wallet
        run: |
          node scripts/check_ci_lane_ownership.mjs
          node scripts/check_crates_release_workflows.mjs
          node scripts/check_rust_release_policy.mjs
          node --test scripts/*.test.mjs

      - name: Check release version and publish order
        env:
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
        working-directory: wallet
        run: node scripts/publish-crates-in-order.mjs order

      - name: Verify registry sibling packages match tested commits
        working-directory: wallet
        run: node scripts/verify_sibling_registry_sources.mjs

      - name: Inspect normalized crate tarballs and dry-run publication
        env:
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
        working-directory: wallet
        run: node scripts/publish-crates-in-order.mjs inspect

      - name: Write reviewed package attestation
        env:
          FUZZ_RUN_ID: ${{ needs.verify-source-sha.outputs.fuzz_run_id }}
          PROTOBUF_CI_RUN_ID: ${{ needs.verify-source-sha.outputs.protobuf_ci_run_id }}
          RELEASE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
          RUST_CI_RUN_ID: ${{ needs.verify-source-sha.outputs.rust_ci_run_id }}
        working-directory: wallet
        run: node scripts/write_release_attestation.mjs

      - name: Upload reviewed package attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reallyme-wallet-crates-preflight-${{ inputs.version }}-${{ github.sha }}
          path: wallet/release-attestation/crates-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload reviewed crate archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reallyme-wallet-crate-archives-${{ inputs.version }}-${{ github.sha }}
          path: wallet/target/package/*.crate
          if-no-files-found: error
          retention-days: 30

  attest-reviewed-evidence:
    name: Attest reviewed package evidence
    needs: [verify-source-sha, crates-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download reviewed package attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reallyme-wallet-crates-preflight-${{ inputs.version }}-${{ github.sha }}
          path: release-attestation

      - name: Download reviewed crate archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reallyme-wallet-crate-archives-${{ inputs.version }}-${{ github.sha }}
          path: reviewed-crates

      - name: Cryptographically attest reviewed package evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-attestation/crates-preflight.json

      - name: Cryptographically attest reviewed crate archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reviewed-crates/*.crate

      - name: Summarize reviewed release
        env:
          RELEASE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
        run: |
          {
            echo '## Crates package preflight passed'
            echo
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Publish set: all 17 approved ReallyMe Wallet crates"
            echo "- Attestation run ID: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
